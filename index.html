<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaData Studio v5.0 – Dashboard Analytics & SCADA Hydraulics</title>
    <link rel="stylesheet" href="css/style.css?v=2.3.0">
    <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono & Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js & Mermaid – copies locales (fonctionne hors-ligne) + fallback CDN -->
    <script src="js/vendor/chart.umd.min.js"></script>
    <script>
        if (typeof window.Chart === 'undefined') {
            document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/chart.js"><\/scr' + 'ipt>');
        }
    </script>
    <script src="js/vendor/mermaid.min.js"></script>
    <script>
        if (typeof window.mermaid === 'undefined') {
            document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"><\/scr' + 'ipt>');
        }
    </script>
    <!-- Leaflet CSS & JS pour la cartographie SIG & tracés KML -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>

    <!-- Ambient Glowing Nebulae -->
    <div class="ambient-purple-orb"></div>
    <div class="ambient-magenta-orb"></div>

    <!-- Hidden SVG Gradients for Circular Donut Gauges -->
    <svg width="0" height="0" style="position:absolute; visibility:hidden;">
        <defs>
            <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#ec4899"/>
            </linearGradient>
            <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#06b6d4"/>
                <stop offset="100%" stop-color="#3b82f6"/>
            </linearGradient>
            <linearGradient id="magenta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ec4899"/>
                <stop offset="100%" stop-color="#f43f5e"/>
            </linearGradient>
            <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10b981"/>
                <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- ================================================================
         INTRO SPLASH SCREEN
         ================================================================ -->
    <div id="intro-splash-overlay" class="intro-splash-overlay intro-cinema-mode">
        <canvas id="intro-cinema-canvas"></canvas>
        <div class="intro-cinema-vignette"></div>
    </div>

    <!-- ================================================================
         MAIN APP CONTAINER
         ================================================================ -->
    <div class="app-container-frame">
        
        <!-- Left Vertical Dock Sidebar -->
        <aside class="app-sidebar-dock">
            <div class="sidebar-logo-icon" id="sidebar-logo-reopen-intro" title="Open Introduction">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline></svg>
            </div>

            <nav class="sidebar-nav-list scada-tabs">
                <button class="sidebar-nav-btn tab-btn active" data-tab="pane-dashboard" title="Dashboard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>
                </button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="app-main-content">
            
            <!-- Top Header Bar -->
            <header class="top-analytics-header">
                <div class="header-title-search">
                    <div class="dashboard-main-heading">
                        <h1>AquaData Studio v5.0</h1>
                        <p>Water Network Optimization & SCADA Dashboard</p>
                    </div>
                </div>

                <div class="header-actions-profile">
                    <button id="btn-run-sim" class="btn-header-action btn-primary-glow">
                        <span>▶ Simulate</span>
                    </button>
                </div>
            </header>

            <!-- Tab Panes Container -->
            <div class="tab-panes-container">
                <div id="pane-dashboard" class="tab-pane active">
                    <div style="padding: 20px; color: #cbd5e1; text-align: center;">
                        <h2>Welcome to AquaData Studio</h2>
                        <p>Dashboard is loading...</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ================================================================
         SCRIPT LOADING ORDER - CRITICAL FOR FUNCTIONALITY
         ================================================================ -->
    
    <!-- 1. Core simulation engine (no dependencies) -->
    <script src="js/simulation.js"></script>
    
    <!-- 2. State management (no dependencies) -->
    <script src="js/state.js"></script>
    
    <!-- 3. API Mock (depends on SimEngine) -->
    <script src="js/api-mock.js"></script>
    
    <!-- 4. Schema and data -->
    <script type="module">
        import * as schema from './js/schema.js';
        window.schemaModule = schema;
    </script>
    
    <!-- 5. Charts module (depends on Chart.js & schema) -->
    <script type="module">
        import * as charts from './js/charts.js';
        window.chartsModule = charts;
    </script>
    
    <!-- 6. UI utilities -->
    <script src="js/ui-utils.js"></script>
    
    <!-- 7. Feature modules -->
    <script src="js/cinematic_intro.js"></script>
    <script src="js/alerts.js"></script>
    
    <!-- 8. Main app initialization (depends on all features) -->
    <script src="js/app.js"></script>

</body>
</html>
